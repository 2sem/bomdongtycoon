name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build and Test
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - name: Checkout project
        uses: actions/checkout@v7

      - name: Install mise
        uses: jdx/mise-action@v5

      - name: Cache SPM checkouts
        uses: actions/cache@v6
        with:
          path: |
            Tuist/.build
            ~/.cache/tuist
            ~/.cache/swifterpm
          key: spm-${{ runner.os }}-${{ hashFiles('Tuist/Package.swift') }}

      - name: Install Tuist dependencies
        run: tuist install

      - name: Build app and run GameCore tests
        run: tuist test GameCoreTests
