name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build and Test
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install mise
        uses: jdx/mise-action@v2

      - name: Cache SPM checkouts
        uses: actions/cache@v4
        with:
          path: Tuist/.build
          key: spm-${{ runner.os }}-${{ hashFiles('Tuist/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Install Tuist dependencies
        run: tuist install

      - name: Generate Xcode workspace
        run: tuist generate --no-open

      - name: Build app
        run: |
          xcodebuild build \
            -workspace BomDongTycoon.xcworkspace \
            -scheme BomDongTycoon \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

      - name: Run GameCore tests
        run: tuist test GameCoreTests
