name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build and Test
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DESTINATION: platform=iOS Simulator,name=iPhone 17 Pro
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.1.1.app

      - name: Install mise
        uses: jdx/mise-action@v2

      - name: Cache SPM checkouts
        uses: actions/cache@v4
        with:
          path: Tuist/.build
          key: spm-${{ runner.os }}-${{ hashFiles('Tuist/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Install Tuist dependencies
        run: mise x -- tuist install

      - name: Generate Xcode workspace
        run: mise x -- tuist generate --no-open

      - name: Run GameCore tests
        run: |
          xcodebuild test \
            -workspace BomDongTycoon.xcworkspace \
            -scheme GameCoreTests \
            -destination "$DESTINATION" \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO

      - name: Build app
        run: |
          xcodebuild build \
            -workspace BomDongTycoon.xcworkspace \
            -scheme BomDongTycoon \
            -configuration Debug \
            -destination "$DESTINATION" \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO
