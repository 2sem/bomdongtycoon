name: Deploy iOS

on:
  workflow_dispatch:
    inputs:
      release_target:
        description: "Upload target"
        required: true
        type: choice
        options:
          - testflight
          - app_store_review
        default: testflight
      changelog:
        description: "What changed in this build"
        required: false
        type: string
        default: "Manual release from GitHub Actions"

concurrency:
  group: ${{ github.ref }}/ios/deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Archive and Upload
    runs-on: macos-26
    env:
      PRODUCT_NAME: BomDongTycoon
      PACKAGE_NAME: ${{ secrets.PACKAGE_NAME }}
      PROFILE_NAME: ${{ secrets.PROFILE_NAME }}
      APP_SCHEME: BomDongTycoon
      APP_PROJECT_PATH: ./BomDongTycoon.xcodeproj
      APP_WORKSPACE_PATH: ./BomDongTycoon.xcworkspace
      APP_EXPORT_METHOD: app-store
      IOS_KEYCHAIN: ${{ secrets.IOS_KEYCHAIN }}
      OUTPUT_DIR: ./Output
      ARCHIVE_PATH: ./Output/BomDongTycoon.xcarchive
      IPA_DIR: ./Output/IPA
      EXPORT_OPTIONS_PLIST: ./Output/exportOptions.plist
      IOS_CERT_PATH: ./signing/cert.p12
      IOS_PROFILE_PATH: ./signing/profile.mobileprovision
      IOS_KEY_PATH: ./signing/app-store-connect-api-key.json
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.1.1.app

      - name: Install mise
        uses: jdx/mise-action@v2

      - name: Install pinned tools
        run: mise install

      - name: Prepare output directories
        run: mkdir -p ./signing "$OUTPUT_DIR" "$IPA_DIR"

      - name: Install Tuist dependencies
        run: tuist install

      - name: Generate Xcode workspace
        run: tuist generate --no-open

      - name: Decode signing certificate
        env:
          IOS_CERT_BASE64: ${{ env.IOS_CERT_PATH }}.base64
        run: |
          echo "${{ secrets.IOS_CERT_P12_DATA }}" > "$IOS_CERT_BASE64"
          base64 --decode -i "$IOS_CERT_BASE64" -o "$IOS_CERT_PATH"

      - name: Decode provisioning profile
        env:
          IOS_PROFILE_BASE64: ${{ env.IOS_PROFILE_PATH }}.base64
        run: |
          echo "${{ secrets.IOS_PROFILE_DATA }}" > "$IOS_PROFILE_BASE64"
          base64 --decode -i "$IOS_PROFILE_BASE64" -o "$IOS_PROFILE_PATH"

      - name: Decode App Store Connect API key
        env:
          IOS_KEY_BASE64: ${{ env.IOS_KEY_PATH }}.base64
        run: |
          echo '${{ secrets.IOS_API_KEY }}' > "$IOS_KEY_BASE64"
          base64 --decode -i "$IOS_KEY_BASE64" -o "$IOS_KEY_PATH"
          rm "$IOS_KEY_BASE64"

      - name: Install fastlane
        run: sudo gem install fastlane --no-document

      - name: Configure signing and increment build number
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_CERT_PWD: ${{ secrets.IOS_CERT_P12_PWD }}
          IOS_KEYCHAIN_PWD: ${{ secrets.IOS_KEYCHAIN_PWD }}
        run: fastlane ios setup

      - name: Create export options plist
        run: |
          cat <<EOF > "$EXPORT_OPTIONS_PLIST"
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>$APP_EXPORT_METHOD</string>
              <key>provisioningProfiles</key>
              <dict>
                <key>$PACKAGE_NAME</key>
                <string>$PROFILE_NAME</string>
              </dict>
            <key>signingStyle</key>
            <string>manual</string>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>teamID</key>
            <string>${{ secrets.APPLE_TEAM_ID }}</string>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF

      - name: Archive app
        run: |
          xcodebuild archive \
            -workspace "$APP_WORKSPACE_PATH" \
            -scheme "$APP_SCHEME" \
            -configuration Release \
            -archivePath "$ARCHIVE_PATH" \
            -destination 'generic/platform=iOS'

      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$IPA_DIR" \
            -exportOptionsPlist "$EXPORT_OPTIONS_PLIST"

      - name: Upload build
        env:
          IOS_RELEASE_TARGET: ${{ github.event.inputs.release_target }}
          IOS_CHANGELOG: ${{ github.event.inputs.changelog }}
          IOS_IPA_DIR: ${{ env.IPA_DIR }}
        run: fastlane ios upload
